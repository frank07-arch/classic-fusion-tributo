const LONG_PRESS_MS = 1500;   // 직원 패널 열기
const PANEL_HIDE_MS = 5000;   // 패널 자동 숨김

const v = document.getElementById('v');
const poster = document.getElementById('poster');
const hotspot = document.getElementById('hotspot');
const panel = document.getElementById('panel');
const btnToggle = document.getElementById('btnToggle');
const btnReset = document.getElementById('btnReset');
const icoPlay = document.getElementById('icoPlay');
const icoPause = document.getElementById('icoPause');

poster.style.backgroundImage = 'url(' + POSTER + ')';
v.src = SRC;

let manualPause = false;   // 직원이 '정지'를 누른 상태 (에어팟 탈착 복귀 무시)
let hideTimer = null, pressTimer = null, longPressed = false;

/* ---------- 화면 유지 ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

/* ---------- 아이콘 상태 ---------- */
function updateIcons() {
  const playing = !v.paused;
  icoPlay.classList.toggle('off', playing);
  icoPause.classList.toggle('off', !playing);
}

/* ---------- 재생 상태 처리 ---------- */
v.addEventListener('play', function () {
  poster.classList.add('hide');
  keepAwake(true);
  updateIcons();
});

// 일시정지: 직원 정지면 그 자리 유지 / 그 외(에어팟 탈착, 영상 종료)면 처음으로 복귀
v.addEventListener('pause', function () {
  if (!manualPause) {
    try { v.currentTime = 0; } catch (e) {}
    poster.classList.remove('hide');
    keepAwake(false);
  }
  updateIcons();
});

v.addEventListener('error', function () {
  poster.classList.remove('hide');
});

/* ---------- 고객 터치: 썸네일 탭 → 재생 ---------- */
poster.addEventListener('click', function () {
  manualPause = false;
  v.play().catch(function () {});
});

/* ---------- 직원 패널 ---------- */
function showPanel() {
  panel.classList.add('show');
  armHide();
}
function hidePanel() {
  panel.classList.remove('show');
}
function armHide() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hidePanel, PANEL_HIDE_MS);
}

// 좌상단 길게 누르기 → 패널 열기 / 짧게 누르기 → 썸네일 상태면 재생
hotspot.addEventListener('pointerdown', function () {
  longPressed = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(function () {
    longPressed = true;
    showPanel();
  }, LONG_PRESS_MS);
});
function endPress() {
  clearTimeout(pressTimer);
  if (!longPressed && !poster.classList.contains('hide')) {
    manualPause = false;
    v.play().catch(function () {});
  }
}
hotspot.addEventListener('pointerup', endPress);
hotspot.addEventListener('pointerleave', function () { clearTimeout(pressTimer); });
hotspot.addEventListener('pointercancel', function () { clearTimeout(pressTimer); });

// 정지 / 재생 토글 (정지는 현재 위치 유지)
btnToggle.addEventListener('click', function () {
  armHide();
  if (!v.paused) {
    manualPause = true;
    v.pause();
  } else {
    manualPause = false;
    v.play().catch(function () {});
  }
});

// 처음으로: 0초로 되돌리고 썸네일 표시
btnReset.addEventListener('click', function () {
  armHide();
  manualPause = false;
  v.pause();
  try { v.currentTime = 0; } catch (e) {}
  poster.classList.remove('hide');
  poster.classList.remove('hide');
  updateIcons();
});

updateIcons();
</script>
